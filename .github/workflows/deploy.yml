name: Daten aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 1 * *' # monatlich am 1. um 03:17 UTC: OSM neu laden, Websites neu prüfen
  workflow_dispatch:
    inputs:
      update:
        description: 'Daten neu laden (OSM + Websites)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Daten neu laden
        if: github.event_name == 'schedule' || inputs.update
        run: |
          npm run fetch:osm
          npm run enrich
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daten aktualisiert $(date -u +%F)" && git push)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
